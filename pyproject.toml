[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindful-organizer"
version = "1.1.0"
description = "A mental health-aware productivity and task management application"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nicholas Toledo", email = "nicholas@example.com"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
]
keywords = [
    "mental-health", "productivity", "task-management", "adhd",
    "anxiety", "depression", "ocd", "ptsd", "dbt", "cbt",
    "mood-tracking", "wellness", "organizer",
]
dependencies = [
    "PyQt6>=6.4.0",
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
nlp = [
    "sentence-transformers>=2.2.0",
    "hdbscan>=0.8.28",
    "umap-learn>=0.5.3",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
mindful-organizer = "main:main"
mindful-organizer-gui = "main:main"

[project.urls]
Homepage = "https://github.com/ntoledo319/Mindful-Organizer"
Repository = "https://github.com/ntoledo319/Mindful-Organizer"
Issues = "https://github.com/ntoledo319/Mindful-Organizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["resources/**/*", "windows_store/assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long -- handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --cov=src --cov-report=term-missing --tb=short -p no:fugue_test -p no:pytest_asyncio"
markers = [
    "gui: marks tests that require a GUI",
    "slow: marks tests that are slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
