name: Bug report
description: Report reproducible Paulatim behavior without sharing private records
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Paulatim.

        This is a public repository. Do not attach Paulatim databases, encrypted snapshots, keys, JSON/PDF exports, journals, crisis plans, medication information, check-in data, account details, or screenshots containing personal records. Reproduce the problem with fictional data and redact anything private.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal, wellness, account, and key material from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: Paulatim version
      description: Find this in the installed app or Microsoft Store package details.
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Microsoft Store
        - GitHub Actions review artifact
        - Source checkout
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional data and list the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: restart
    attributes:
      label: Does a full quit and relaunch reproduce it?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility context
      description: Optional. Mention only relevant settings such as Narrator, keyboard-only use, high contrast, text scaling, or reduced motion.
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
      description: Do not paste logs or screenshots until you have checked them for private data.
