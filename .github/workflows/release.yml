name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: hearth-macos
          - os: windows-latest
            artifact: hearth-windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer + main
        run: npm run vite:build

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        # The macOS runner intermittently fails DMG creation with
        # "hdiutil detach ... Command failed" — a known race where the
        # mounted build volume can't be detached. Retry the whole pack
        # once, force-detaching any leftover Hearth volume first.
        run: |
          pack() { npx electron-builder --mac --publish never; }
          if ! pack; then
            echo "electron-builder failed; clearing stale volume and retrying once"
            hdiutil detach -force "/Volumes/Hearth 1.0.0" 2>/dev/null || true
            rm -rf release/*.dmg release/.dmg* || true
            pack
          fi
        env:
          # Unsigned builds — no certs needed. Disable code signing explicitly.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
