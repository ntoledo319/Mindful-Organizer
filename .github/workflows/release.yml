name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: hearth-macos
          - os: windows-latest
            artifact: hearth-windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan repository for committed secrets
        run: npm run secrets

      - name: Validate Store and landing content
        run: npm run store:validate

      - name: Reproduce rights-clean brand assets
        run: |
          npm run brand-assets
          git diff --exit-code -- resources/app-icon.png resources/hero-illustration.png

      - name: Generate icons
        run: npm run icons

      - name: Generate Windows Store assets
        if: matrix.os == 'windows-latest'
        run: npm run winstore-assets

      - name: Lint
        run: npm run lint

      - name: Verify redistributed licenses
        run: npm run licenses

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer + main
        run: npm run vite:build

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        # Ships the .app as a zip (x64 + arm64). DMG creation is omitted:
        # the hosted macOS runners can't reliably mkdir/symlink/detach the
        # DMG build volume under /Volumes (hdiutil "permission denied" /
        # "detach failed"), which is unrelated to the app itself. The zip
        # carries the full unsigned .app and is a standard mac distribution.
        run: npx electron-builder --mac --publish never
        env:
          # Unsigned builds — no certs needed. Disable code signing explicitly.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.appx' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
