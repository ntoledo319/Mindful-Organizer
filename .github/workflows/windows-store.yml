name: Windows Store (MSIX) Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/revenue-cycle-0
    paths:
      - ".github/workflows/windows-store.yml"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.cjs"
      - "electron/**"
      - "src/**"
      - "scripts/generate-windows-store-assets.mjs"
      - "scripts/generate-icons.mjs"
      - "scripts/generate-third-party-notices.mjs"
      - "resources/**"
      - "store/**"

permissions:
  contents: read

jobs:
  build-msix:
    name: Build MSIX for Windows Store
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Store identity
        id: identity
        shell: bash
        run: |
          real=$(node store/identity.cjs --check)
          echo "real=$real" >> "$GITHUB_OUTPUT"
          if [ "$real" != "true" ]; then
            echo "::notice::store/identity.json still contains PLACEHOLDER values — building everything except the appx package. Fill store/identity.json to produce an MSIX."
          fi

      - name: Generate icons and Windows Store assets
        run: |
          npm run icons
          npm run winstore-assets

      - name: Verify redistributed licenses
        run: npm run licenses

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer + main
        run: npm run vite:build

      - name: Package MSIX (appx)
        if: steps.identity.outputs.real == 'true'
        run: npx electron-builder --win appx --x64 --publish never

      - name: Collect MSIX artifact
        if: steps.identity.outputs.real == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f -name '*.appx' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload MSIX
        if: steps.identity.outputs.real == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hearth-msix
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
