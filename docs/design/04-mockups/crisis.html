<!DOCTYPE html>
<html lang="en" data-theme="quiet">
<head>
<meta charset="UTF-8">
<title>Hearth — Crisis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Quiet theme — maximum contrast, single accent, no aesthetic flourish.
     Full-screen takeover. Replaces the entire UI. */
  :root[data-theme="quiet"] {
    --bg-base:        #000000;
    --bg-raised:      #0A0A0A;
    --border-default: #FFFFFF;
    --text-primary:   #FFFFFF;
    --text-secondary: #D4D4D4;
    --text-tertiary:  #9A9A9A;
    --accent:         #FFD400;
    --danger:         #FF4040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .crisis-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 48px 32px;
  }

  /* Header — quiet, identifies the mode without dramatizing */
  .crisis-header {
    text-align: center;
    margin-bottom: 64px;
  }

  .crisis-header-label {
    font-size: 11px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: 12px;
  }

  .crisis-header-message {
    font-family: 'Lora', Georgia, serif;
    font-size: 24px;
    line-height: 36px;
    font-weight: 400;
    max-width: 560px;
    margin: 0 auto;
    color: var(--text-primary);
  }

  /* The three primary actions */
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    align-content: center;
  }

  .action {
    background: var(--bg-raised);
    border: 2px solid var(--border-default);
    padding: 48px 32px;
    cursor: pointer;
    transition: background-color 320ms cubic-bezier(0.2, 0, 0, 1),
                color 320ms cubic-bezier(0.2, 0, 0, 1),
                border-color 320ms cubic-bezier(0.2, 0, 0, 1);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    color: inherit;
  }

  .action:hover {
    background: #FFFFFF;
    color: #000000;
  }

  .action.urgent {
    border-color: var(--accent);
  }
  .action.urgent:hover {
    background: var(--accent);
    color: #000000;
  }

  .action-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: 16px;
    color: inherit;
    opacity: 0.7;
  }

  .action-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 32px;
    line-height: 40px;
    font-weight: 500;
    margin-bottom: 16px;
    color: inherit;
  }

  .action-detail {
    font-size: 14px;
    line-height: 22px;
    color: inherit;
    opacity: 0.8;
    margin-bottom: 32px;
    flex: 1;
  }

  .action-cta {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: inherit;
  }

  .action-cta svg {
    width: 14px; height: 14px;
    stroke: currentColor; stroke-width: 2; fill: none;
  }

  /* Footer — the safety/exit option */
  .crisis-footer {
    text-align: center;
    margin-top: 64px;
    padding-top: 32px;
  }

  .safety-button {
    background: transparent;
    border: 1px solid var(--text-tertiary);
    color: var(--text-tertiary);
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 320ms cubic-bezier(0.2, 0, 0, 1), color 320ms cubic-bezier(0.2, 0, 0, 1);
    font-family: inherit;
  }
  .safety-button:hover {
    border-color: var(--text-primary);
    color: var(--text-primary);
  }

  /* The system status footer — quietly confirms what Hearth has done */
  .system-status {
    margin-top: 32px;
    font-size: 11px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .system-status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<main class="crisis-screen">

  <header class="crisis-header">
    <div class="crisis-header-label">Crisis mode</div>
    <p class="crisis-header-message">
      Your screen is dimmed. Notifications are paused. The next step is one click.
    </p>
  </header>

  <div class="actions">

    <button class="action urgent">
      <div class="action-label">Talk to someone now</div>
      <div class="action-title">Call 988</div>
      <div class="action-detail">
        Suicide &amp; Crisis Lifeline. Free, confidential, 24/7. Trained counselors who answer.
      </div>
      <div class="action-cta">
        Call now
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
      </div>
    </button>

    <button class="action">
      <div class="action-label">If a call feels like too much</div>
      <div class="action-title">Text the Crisis Line</div>
      <div class="action-detail">
        Text HOME to 741741. Same support, no phone call. Reply usually within a minute.
      </div>
      <div class="action-cta">
        Open texts
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
      </div>
    </button>

    <button class="action">
      <div class="action-label">Your saved plan</div>
      <div class="action-title">Show me what to do right now.</div>
      <div class="action-detail">
        Your crisis plan — the people, the places, and the small things you wrote down when you were steadier.
      </div>
      <div class="action-cta">
        Open my plan
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
      </div>
    </button>

  </div>

  <footer class="crisis-footer">
    <button class="safety-button">I'm safe — close this</button>
    <div class="system-status">
      <span class="dot"></span>
      Display dimmed · Do Not Disturb · Other windows minimized
    </div>
  </footer>

</main>

</body>
</html>
